<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ebebeb" />
    <link rel="icon" href="/favicon-96.png?v=4" type="image/png" sizes="96x96" />
    <script>
      try { const theme = localStorage.getItem('calcphysics-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}
    </script>
    <noscript><style>.theory-panel[hidden] { display: block !important; } .theory-heading { display: none !important; }</style></noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
